name: Windows CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW + Python + gcovr
        run: |
          choco install mingw --yes
          python -m pip install --upgrade pip
          pip install gcovr

      - name: Configure CMake for UNIT tests (GCC)
        env:
          CC: gcc
          CXX: g++
        run: cmake -S Tests/Unit -B build_unit -G "MinGW Makefiles"

      - name: Build UNIT tests
        run: cmake --build build_unit

      - name: Run UNIT tests
        run: ctest --test-dir build_unit --output-on-failure

      - name: Generate Coverage (gcovr)
        run: |
          gcovr -r . --object-directory build_unit --exclude "Tests/Integration" --exclude "Tests/Integration/*" --xml-pretty -o coverage.xml
          gcovr -r . --object-directory build_unit --exclude "Tests/Integration" --exclude "Tests/Integration/*" --html-details -o coverage.html

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.html

  integration-tests:
    runs-on: windows-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python & pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Configure CMake for INTEGRATION tests (MSVC)
        run: cmake -S Tests/Integration -B build_integration

      - name: Build Integration Tests (DLL)
        run: cmake --build build_integration --config Release

      - name: Run Integration Tests
        working-directory: Tests/Integration
        run: pytest -vv
